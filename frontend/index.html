<!doctype html>
<html lang="it" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08110d" />
    <meta
      name="description"
      content="Saldo — gestisci conti, movimenti, budget, obiettivi e previsioni delle tue finanze personali."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Saldo — Le tue finanze personali</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      (function () {
        try {
          var preference = localStorage.getItem('saldo.theme') || 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          /* storage not available */
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
